<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Klantenkaart</title>
  <meta name="description" content="Een kaart per klant: alles wat je over hen weet, in één oogopslag.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232f6fed'/><rect x='22' y='30' width='56' height='40' rx='6' fill='white'/><rect x='30' y='40' width='18' height='6' rx='3' fill='%232f6fed'/><rect x='30' y='52' width='40' height='4' rx='2' fill='%23a9c2f5'/></svg>">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="balk">
    <a class="brand" href="#/">
      <span class="brand-mark" aria-hidden="true"></span>
      <span>Klantenkaart</span>
    </a>
    <div class="balk-acties">
      <button class="btn btn-primary" id="btn-nieuw">+ Nieuwe kaart</button>
    </div>
  </header>

  <main id="view" aria-live="polite"></main>

  <footer class="voet">
    <a href="/api/klanten/export.csv">Alle kaarten als CSV</a>
    <button class="linklike" id="btn-import">Kaarten importeren</button>
  </footer>

  <div class="toasts" id="toasts" aria-live="assertive"></div>
  <dialog id="modal" class="modal"></dialog>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
