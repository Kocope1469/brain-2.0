<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Klantenkaart</title>
  <meta name="description" content="Al je klanten op de kaart, gekleurd naar hoe lang geleden je er langsging.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23151a21'/><circle cx='38' cy='38' r='11' fill='%2322a559'/><circle cx='66' cy='52' r='9' fill='%23d98324'/><circle cx='42' cy='68' r='9' fill='%23d3453d'/></svg>">
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="balk">
    <input id="zoek" class="zoek" type="search" autocomplete="off" placeholder="Zoek klant of stad">
    <button class="btn" id="filter" aria-expanded="false">
      <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true" fill="currentColor">
        <path d="M1 2.5h14L9.5 8.8V14L6.5 12.4V8.8z"/>
      </svg>
      Filter
    </button>
  </header>

  <nav class="chips" id="chips" aria-label="Filter op laatste bezoek">
    <button class="chip recent"  data-bucket="recent" aria-pressed="false">Recent bezocht <span></span></button>
    <button class="chip tijdje"  data-bucket="tijdje" aria-pressed="false">Een tijdje geleden <span></span></button>
    <button class="chip lang"    data-bucket="lang"   aria-pressed="false">Lang niet bezocht <span></span></button>
  </nav>

  <div class="filterlade" id="filterlade" hidden>
    <label for="tag">Tag</label>
    <select id="tag"><option value="">Alle tags</option></select>
    <button class="btn btn-sm" id="wis">Filters wissen</button>
    <span class="rek"></span>
    <a href="/api/klanten/export.csv">CSV</a>
    <button class="linklike" id="import">Importeren</button>
    <button class="linklike" id="nieuw">+ Nieuwe klant</button>
  </div>

  <div class="werkblad">
    <section class="kaartvak">
      <div id="kaart" role="application" aria-label="Kaart met klanten"></div>
      <p class="kaartmelding" id="kaartmelding" hidden></p>
      <div class="plaatsbalk" id="plaatsbalk" hidden>
        <span id="plaatstekst"></span>
        <button class="btn btn-sm" id="plaatsstop">Annuleren</button>
      </div>
    </section>
    <aside class="dossier" id="dossier" aria-live="polite"></aside>
  </div>

  <div class="toasts" id="toasts" aria-live="assertive"></div>
  <dialog id="modal" class="modal"></dialog>

  <script src="/vendor/leaflet/leaflet.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
