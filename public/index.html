<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Klantenkaart</title>
  <meta name="description" content="Lichtgewicht klantenbeheer voor KMO's: alle klantinfo, contactmomenten, opdrachten en opvolging op één kaart.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232f6fed'/><rect x='22' y='30' width='56' height='40' rx='6' fill='white'/><rect x='30' y='40' width='18' height='6' rx='3' fill='%232f6fed'/><rect x='30' y='52' width='40' height='4' rx='2' fill='%23a9c2f5'/></svg>">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-text">Klantenkaart</span>
      </div>
      <nav id="nav">
        <a href="#/" data-route="">Dashboard</a>
        <a href="#/klanten" data-route="klanten">Klanten</a>
        <a href="#/taken" data-route="taken">Opvolging <span class="pill" id="nav-taken" hidden>0</span></a>
      </nav>
      <div class="sidebar-foot">
        <button class="btn btn-primary block" id="btn-nieuw">+ Nieuwe klant</button>
        <div class="sidebar-links">
          <a href="/api/klanten/export.csv">Exporteer CSV</a>
          <button class="linklike" id="btn-import">Importeer CSV</button>
        </div>
      </div>
    </aside>
    <main id="view" class="view" aria-live="polite"></main>
  </div>

  <div class="toasts" id="toasts" aria-live="assertive"></div>
  <dialog id="modal" class="modal"></dialog>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
